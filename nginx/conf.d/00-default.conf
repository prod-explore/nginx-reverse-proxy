# Catch-all. A request whose Host matches none of the configured sites (a
# scanner hitting the bare IP, a stale DNS record) gets nothing: the connection
# is closed, and the TLS handshake is refused without presenting any
# certificate, so the names of the sites hosted here are not disclosed either.
#
# Every server listens on IPv4 only. Docker publishes 80/443 on the host's IPv4
# and IPv6 addresses and forwards both to the container's IPv4 address, so IPv6
# clients are still served; a "listen [::]:..." line would only make nginx fail
# to start on a host whose kernel has IPv6 disabled.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Health endpoint for the container's healthcheck. Loopback only, not reachable
# from the internet or from other containers.
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
