# Top-level nginx configuration: process limits and the http-wide defaults that
# every site inherits. Shared per-server pieces live in snippets/, the catch-all
# and health servers in conf.d/, and the sites themselves in sites/*.conf, which
# stay on the server and out of the repository.
#
# nginx is started with -c pointing here, so relative include paths, in this
# file and in every site, resolve against this directory. The image's own
# /etc/nginx/nginx.conf is not used.

worker_processes auto;
# A proxied request holds two descriptors (client and upstream), so the file
# limit is twice worker_connections.
worker_rlimit_nofile 8192;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;   # from the image
    default_type  application/octet-stream;

    server_tokens off;

    # One line per request, with request and upstream timings, to stdout and
    # stderr so that `docker logs` shows them.
    log_format main '$remote_addr $host "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile            on;
    tcp_nopush          on;
    # Short client timeouts and bounded header buffers: a slow client (slowloris)
    # cannot hold a connection open for long.
    keepalive_timeout   30s;
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    client_max_body_size  10m;       # raise per site where uploads are expected
    large_client_header_buffers 4 16k;

    # text/html is compressed whenever gzip is on and needs no entry in gzip_types.
    # A page that reflects attacker-influenced input next to a secret (a CSRF
    # token) is then exposed to BREACH; turn gzip off for text/html on such a site.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # The client a limit counts: an IPv4 address, or an IPv6 /64. An IPv6 client
    # usually holds a whole /64 (a phone on mobile data does) and can use any
    # address in it, so a per-address key would let it multiply every limit.
    # $remote_addr compresses the longest run of zero groups to "::"; the patterns
    # spell the first four groups out with zeros, so that every address of one
    # /64 gets the same key (quoted, as nginx would read "{" as a block). Built
    # once per request, when a limit first reads it.
    map $remote_addr $limit_key {
        "~^(?<p>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"       $p;
        "~^(?<p>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                $p:0;
        "~^(?<p>[0-9a-f]+:[0-9a-f]+)::"                          $p:0:0;
        "~^(?<p>[0-9a-f]+)::(?<q>[0-9a-f]+)(:[0-9a-f]+){4}$"     $p:0:0:$q;
        "~^(?<p>[0-9a-f]+)::"                                    $p:0:0:0;
        default                                                  $binary_remote_addr;
    }

    # Per-client rate and connection limit zones. They are only declared here:
    # each site applies them per location (see examples/). "login" is the stricter
    # zone for authentication endpoints.
    limit_req_zone  $limit_key zone=perip:10m rate=20r/s;
    limit_req_zone  $limit_key zone=login:10m rate=5r/m;
    limit_conn_zone $limit_key zone=connperip:10m;
    # 429 Too Many Requests instead of the default 503 Service Unavailable.
    limit_req_status  429;
    limit_conn_status 429;

    # Send "Connection: upgrade" upstream only when the client asked for an
    # upgrade; an empty value drops the header from ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's embedded DNS. Sites resolve their upstreams per request (see
    # examples/), so a backend that restarts or is not up yet never prevents nginx
    # from starting. A lookup that hangs fails the request after 5 s instead of
    # the default 30 s. ipv6=off skips AAAA lookups: by design, backend networks
    # are IPv4-only (containers need no IPv6; only the proxy's own network has it,
    # for clients), so a backend never has an IPv6 address to find.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    include snippets/ssl.conf;

    include conf.d/*.conf;
    include /etc/nginx/sites/*.conf;
}
