# Main configuration. Everything site-specific lives in sites/*.conf (not committed);
# everything shared lives in snippets/.

worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Information leaks ────────────────────────────────────────────────────
    server_tokens off;

    # ── Logging: one line per request, with timings, to stdout (docker logs) ──
    log_format main '$remote_addr $host "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ── Connections and timeouts: slow-client (slowloris) protection ─────────
    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   30s;
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;
    client_max_body_size  10m;       # raise per site where uploads are expected
    large_client_header_buffers 4 16k;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # ── Abuse protection (zones are applied per location in examples/) ───
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;   # for auth endpoints, see README
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ── WebSocket: send "Connection: upgrade" only when the client asked for it ─
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Docker's embedded DNS. Upstreams are resolved per request (see examples/),
    # so a backend that restarts or is not up yet never prevents nginx from starting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include snippets/ssl.conf;

    include conf.d/*.conf;
    include /etc/nginx/sites/*.conf;
}
