# Request headers and protocol for every proxied location: what the backend needs
# to know about the original request, and nothing a client can forge.

# HTTP/1.1 upstream: an HTTP/1.0 request cannot carry a WebSocket upgrade.
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# $remote_addr, not $proxy_add_x_forwarded_for: whatever the client put in
# X-Forwarded-For is dropped, so it cannot spoof its address to the backend.
# A backend behind this proxy alone should trust exactly one hop (in Express,
# "trust proxy" set to 1).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Headers a client could otherwise pass straight through: an RFC 7239 Forwarded
# header carries a client-chosen address just like X-Forwarded-For, and Proxy
# is the httpoxy vector (it becomes HTTP_PROXY in CGI-style backends).
proxy_set_header Forwarded         "";
proxy_set_header Proxy             "";

proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Keep the backend's framework, and often its version, out of responses.
proxy_hide_header X-Powered-By;
