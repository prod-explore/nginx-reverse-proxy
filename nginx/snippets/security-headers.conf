# Include in a server block, never in a location: add_header in a location
# silently discards every add_header inherited from the server block.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
# Content-Security-Policy belongs to the application: it knows which scripts it loads.
