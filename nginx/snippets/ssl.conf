# TLS, "intermediate" profile of the Mozilla server-side TLS guidelines:
# TLS 1.2 + 1.3, forward-secret AEAD ciphers only, client picks the cipher
# (modern clients choose well; this avoids penalising mobile CPUs).
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Session resumption through the server-side cache only. Tickets are off because
# their key is not rotated, which would break forward secrecy.
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# OCSP stapling: the server delivers the revocation status, so clients do not
# have to ask the CA (faster, and does not leak which sites they visit).
ssl_stapling              on;
ssl_stapling_verify       on;
