# TLS for every server, included once at http level. Certificates are per site.
#
# "Intermediate" profile of the Mozilla server-side TLS guidelines:
# TLS 1.2 + 1.3, forward-secret ECDHE AEAD ciphers only. The profile's DHE suites
# are left out, so there is no dhparam file to generate and manage. The client
# picks the cipher (modern clients choose well; this avoids penalising mobile CPUs).
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# Session resumption through the shared server-side cache (1 MB holds about
# 4000 sessions). Tickets stay off, as in the Mozilla guidelines: every ticket is
# encrypted with a key shared by all the sessions issued under it, and whoever
# obtains that key can decrypt their recorded traffic. The cache gives clients
# the same fast reconnect without a key shared across sessions.
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# No OCSP stapling: Let's Encrypt certificates name no OCSP responder (revocation
# is published through CRLs), so "ssl_stapling on" would only log a warning on
# every reload.
