# Let's Encrypt HTTP-01 challenge, served from the webroot certbot writes to.
# Include in each site's port 80 server, so that certificates can be issued and
# renewed while every other request redirects to HTTPS. ^~ keeps the site's
# regex locations (such as the dotfile rule) from taking these requests.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    allow all;
}
