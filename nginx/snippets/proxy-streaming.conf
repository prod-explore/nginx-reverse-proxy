# Server-sent events, long polling and WebSockets: no buffering, long timeouts.
# Include instead of proxy-timeouts.conf, never with it: both set the same
# directives, and nginx rejects a duplicate. gzip is off because it buffers the
# output, which would hold events back.
proxy_connect_timeout 5s;
proxy_send_timeout    1h;
proxy_read_timeout    1h;
proxy_buffering       off;
proxy_cache           off;
gzip                  off;
