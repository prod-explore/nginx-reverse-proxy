# nginx terminates TLS for every site; certbot issues and renews the certificates.
# Add the networks of the backends in docker-compose.override.yml (see the example).

name: proxy

services:
  nginx:
    image: nginx:1.28.3-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The configuration nginx runs, inside the nginx/ mount below. Every nginx
      # command in this container needs it as -c (scripts/reload.sh takes it from
      # the environment); scripts/fixtures.sh reads the value from this line.
      NGINX_CONF: /etc/nginx/proxy/nginx.conf
    # Directories only, never a single file: a file bind mount stays on the inode
    # it was started with, so after git or an editor replaces the file, nginx
    # would keep reading the old copy until the container is recreated.
    volumes:
      - ./nginx:/etc/nginx/proxy:ro
      - ./sites:/etc/nginx/sites:ro
      - ./certs/conf:/etc/letsencrypt:ro
      - ./certs/www:/var/www/certbot:ro
    # Reload every 6 h so that renewed certificates are picked up without a
    # restart. $$ is compose's escape for a literal $.
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -c "$$NGINX_CONF" -s reload; done &
      exec nginx -c "$$NGINX_CONF" -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Hardening: nothing writable but tmpfs, no extra privileges, only the
    # capabilities nginx needs: NET_BIND_SERVICE for ports 80 and 443, SETUID and
    # SETGID for the master to start its workers as the nginx user, CHOWN for the
    # master to hand its temp directories to that user.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: certbot
    restart: unless-stopped
    # Checks twice a day; certbot renews only the certificates that are close to
    # expiry. Sleeping in the background and waiting lets the TERM trap run at
    # once on `docker stop`, instead of after the sleep ends.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - ./certs/conf:/etc/letsencrypt
      - ./certs/www:/var/www/certbot
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # The network the published ports lead to. With IPv6 on it, Docker (ip6tables,
  # on by default since Engine 27) forwards an IPv6 connection to nginx's own IPv6
  # address and the client address is kept. On an IPv4-only network Docker's
  # userland proxy relays it instead, and nginx sees a Docker gateway address for
  # every IPv6 client. No subnet is set: the daemon allocates a unique local /64.
  # Backend networks stay IPv4-only; nginx reaches backends over IPv4.
  default:
    enable_ipv6: true
