# Weekly update PRs for the images in docker-compose.yml and the actions in
# .github/workflows. CI runs on every one of them.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]
    # nginx's even minor versions are its stable branch and the odd ones its
    # mainline, so a minor bump would leave stable. Moving to the next stable
    # branch is a manual change.
    ignore:
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
