# Weekly update PRs for the two images in docker-compose.yml (nginx, certbot)
# and for the actions in .github/workflows. CI validates every one of them.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]
    # nginx's even minor versions (1.28) are the stable branch, the odd ones (1.29) are mainline: stay on stable, patches only.
    ignore:
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
