name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  config:
    name: nginx -t, smoke test and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh
      - name: Validate the nginx configuration
        run: scripts/check.sh
      - name: Validate the compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml config -q
      - name: Smoke test the running proxy
        run: scripts/smoke-test.sh
