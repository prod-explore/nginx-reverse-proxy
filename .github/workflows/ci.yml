name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config:
    name: nginx -t and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Validate the nginx configuration
        run: scripts/check.sh
      - name: Validate the compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml config -q
